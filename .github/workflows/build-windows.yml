name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build

      - name: Install Python backend dependencies + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Freeze Python backend into a single sidecar exe
        working-directory: backend
        run: pyinstaller --onefile --name backend-sidecar main.py

      - name: Rename sidecar to Tauri's required target-triple format
        working-directory: backend
        run: |
          $triple = "x86_64-pc-windows-msvc"
          Rename-Item -Path "dist\backend-sidecar.exe" -NewName "backend-sidecar-$triple.exe"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build --verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-gui-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
